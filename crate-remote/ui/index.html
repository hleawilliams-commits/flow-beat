<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Crate Remote</title>
<style>
:root{--bg:#0b0912;--panel:#171323;--panel2:#211b31;--line:#2e2643;--text:#f3eefc;--dim:#a39cb6;
--hi:#32d5ff;--good:#3cd070;--risky:#d49a21;--clash:#e5484d;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:12px 16px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;margin-left:auto}
.seg button{padding:8px 14px;border-radius:8px;color:var(--dim);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text)}
#decks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 10px}
.deck{background:var(--panel);border:2px solid transparent;border-radius:var(--r);padding:10px 12px;text-align:left;min-height:84px}
.deck.ref{border-color:var(--hi)}
.deck .n{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
.deck .n .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.deck .n .dot.play{background:var(--good)}
.deck .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 2px}
.deck .m{font-size:14px;color:var(--dim);display:flex;gap:10px}
.deck .m .left.warn{color:var(--risky)}.deck .m .left.end{color:var(--clash)}
nav{display:flex;gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
nav button{padding:10px 16px;border-radius:10px;color:var(--dim);font-weight:650}
nav button.on{background:var(--panel2);color:var(--text)}
#bar{display:flex;gap:10px;padding:12px 16px;align-items:center}
#q{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;padding:12px 14px}
.chip{padding:8px 12px;border-radius:999px;background:var(--panel);color:var(--dim);font-size:14px;font-weight:600}
.chip.on{background:var(--panel2);color:var(--text)}
main{padding:0 16px 120px}
.hint{color:var(--dim);padding:18px 4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row .k{width:52px;flex:none;text-align:center;font-weight:700;border-radius:8px;padding:6px 0;background:var(--panel)}
.k.good{color:#06210f;background:var(--good)}.k.risky{color:#2a1a00;background:var(--risky)}.k.clash{color:#fff;background:var(--clash)}
.row .tt{flex:1;min-width:0}
.row .tt b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt span{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .bpm{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.row .bpm small{display:block;color:var(--dim);font-size:12px}
.row .played{color:var(--dim);font-size:12px}
.add{width:48px;height:48px;border-radius:12px;background:var(--panel2);font-size:24px;font-weight:600;flex:none}
.add.done{background:var(--hi);color:#03141a}
.folder{padding:14px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-weight:600}
.folder .ic{color:var(--dim);width:22px}
#pin{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
#pin input{font-size:40px;letter-spacing:.4em;text-align:center;width:220px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#pin p{color:var(--dim);text-align:center;max-width:420px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel2);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:none;box-shadow:0 -10px 30px #0008}
#sheet .t{font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet .s{color:var(--dim);font-size:14px;margin-bottom:12px}
#sheet .acts{display:grid;grid-template-columns:1.4fr repeat(4,1fr) .8fr;gap:8px}
#sheet button{padding:16px 6px;border-radius:12px;background:var(--panel);font-weight:700}
#sheet button.go{background:var(--hi);color:#03141a}
#sheet button:disabled{opacity:.35}
#navmsg{padding:6px 16px;color:var(--dim);font-size:14px;min-height:22px}
.row .tt{cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);padding:12px 18px;border-radius:12px;display:none}
@media (max-width:700px){#decks{grid-template-columns:repeat(2,1fr)}.row .bpm{width:70px}}
</style>
</head>
<body>
<div id="pin">
  <h1>Crate Remote</h1>
  <p>Enter the PIN shown on the deck: Mod Menu → Community Mods → Installed → Crate Remote.</p>
  <input id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off">
</div>
<header>
  <h1>Crate Remote</h1>
  <div class="seg" id="sticks"><button data-s="0" class="on">USB 1</button><button data-s="1">USB 2</button></div>
</header>
<section id="decks"></section>
<nav id="tabs">
  <button data-t="fits" class="on">Fits next</button><button data-t="search">Search</button>
  <button data-t="lists">Playlists</button><button data-t="queue">Queue <span id="qn"></span></button>
</nav>
<div id="navmsg"></div>
<div id="bar"></div>
<main id="list"><p class="hint">Loading…</p></main>
<div id="toast"></div>
<div id="sheet"><div class="t" id="shT"></div><div class="s" id="shS"></div>
  <div class="acts"><button class="go" id="shShow">Show on deck</button>
  <button data-ld="1">Load 1</button><button data-ld="2">Load 2</button><button data-ld="3">Load 3</button><button data-ld="4">Load 4</button>
  <button id="shX">Close</button></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let PIN=localStorage.getItem("cr_pin")||"", stick=0, tab="fits", ref=-1, refPinned=false;
let lib=[null,null], lists=[null,null], state={decks:[],queue:[]}, query="", path=[], bpmWin=6, plIds=null;
const played=new Set(JSON.parse(sessionStorage.getItem("cr_played")||"[]"));
// ---- keys -> Camelot ----
const MAJ={C:8,G:9,D:10,A:11,E:12,B:1,"F#":2,Gb:2,Db:3,"C#":3,Ab:4,"G#":4,Eb:5,"D#":5,Bb:6,"A#":6,F:7};
const MIN={A:8,E:9,B:10,"F#":11,Gb:11,"C#":12,Db:12,"G#":1,Ab:1,"D#":2,Eb:2,"A#":3,Bb:3,F:4,C:5,G:6,D:7};
function cam(k){
  if(!k)return null; k=k.trim(); let m;
  if((m=k.match(/^(\d{1,2})([AB])$/i))){const n=+m[1];return n>=1&&n<=12?{n,b:m[2].toUpperCase()==="B"}:null}
  if((m=k.match(/^(\d{1,2})([dm])$/i))){const o=+m[1];if(o<1||o>12)return null;return{n:(o+6)%12+1,b:m[2].toLowerCase()==="d"}}
  if((m=k.match(/^([A-G])([#b♯♭]?)\s*(m|min|minor|maj|major)?$/))){
    const root=m[1]+(m[2]==="♯"?"#":m[2]==="♭"?"b":m[2]), minor=/^m/.test(m[3]||"")&&!/^maj/.test(m[3]||"");
    const n=(minor?MIN:MAJ)[root]; return n?{n,b:!minor}:null}
  return null;
}
const camStr=c=>c?c.n+(c.b?"B":"A"):"--";
function match(a,b){ // same rules as the deck's Mix hints
  if(!a||!b)return"";let d=Math.abs(a.n-b.n);if(d>6)d=12-d;
  if(a.b===b.b&&d<=1)return"good"; if(a.b!==b.b&&d===0)return"good";
  if((a.b===b.b&&d===2)||(a.b!==b.b&&d===1))return"risky"; return"clash";
}
function bpmGap(bpm,refBpm){ // closest of 1x, 2x, 1/2x; percent
  if(!(bpm>0&&refBpm>0))return null; let best=null;
  for(const f of[1,2,.5]){const g=(bpm*f-refBpm)/refBpm*100;if(best===null||Math.abs(g)<Math.abs(best.g))best={g,f}}
  return best;
}
// ---- api ----
async function api(p){
  const r=await fetch(p+(p.includes("?")?"&":"?")+"pin="+encodeURIComponent(PIN),{cache:"no-store"});
  if(r.status===403){askPin();throw new Error("pin")}
  if(!r.ok)throw new Error(r.status); return r.json();
}
function askPin(){ $("#pin").style.display="flex"; $("#pinIn").value=""; $("#pinIn").focus(); }
$("#pinIn").addEventListener("input",e=>{ if(e.target.value.length===4){PIN=e.target.value;localStorage.setItem("cr_pin",PIN);$("#pin").style.display="none";boot()} });
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display="none",1800)}
async function loadLib(s,force){
  const j=await api(`/api/tracks?stick=${s}${force?"&refresh=1":""}`);
  lib[s]=j.ok?j.tracks.map(t=>({id:t[0],title:t[1],artist:t[2],key:t[3],bpm:t[4],len:t[5],c:cam(t[3]),s})):[];
}
async function loadLists(s){ const j=await api(`/api/playlists?stick=${s}`); lists[s]=j.ok?j.playlists.map(p=>({id:p[0],parent:p[1],folder:!!p[2],name:p[3]})):[]; }
// ---- decks ----
const fmt=s=>s>0?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"";
function pickRef(){
  if(refPinned&&state.decks[ref]&&state.decks[ref].loaded)return;
  // longest-playing guess: the playing deck furthest into its track
  let best=-1;state.decks.forEach((d,i)=>{if(d.loaded&&d.playing&&(best<0||d.pos>state.decks[best].pos))best=i});
  if(best<0)state.decks.forEach((d,i)=>{if(d.loaded&&best<0)best=i}); ref=best;
}
// The deck doesn't report key/length to mods: fill them from the library by track id,
// preferring the stick whose title matches (ids can repeat across sticks).
function fillDecks(){
  for(const d of state.decks){ if(!d.loaded)continue;
    let hit=null; for(const L of lib){ if(!L)continue; const t=L.find(x=>x.id===d.id); if(t&&(!hit||t.title===d.title))hit=t }
    if(hit){ if(!d.key)d.key=hit.key; if(!(d.len>0))d.len=hit.len; d.s=hit.s } }
}
function drawDecks(){
  fillDecks(); pickRef();
  $("#decks").innerHTML=state.decks.map((d,i)=>{
    if(!d.loaded)return`<button class="deck" disabled><div class="n"><span class="dot"></span>Deck ${d.d}</div><div class="t" style="color:var(--dim)">Empty</div></button>`;
    played.add(d.id); const left=d.len>0&&d.pos>=0?d.len-d.pos:-1;
    const cls=left>=0&&d.playing?(left<=10?"end":left<=30?"warn":""):"";
    return`<button class="deck ${i===ref?"ref":""}" data-i="${i}"><div class="n"><span class="dot ${d.playing?"play":""}"></span>Deck ${d.d}${d.stems_on?" · stems":""}</div>
    <div class="t">${esc(d.title||"Track loaded")}</div><div class="m"><span>${camStr(cam(d.key))}</span><span>${d.bpm?d.bpm.toFixed(1):""}</span><span class="left ${cls}">${left>=0?"-"+fmt(left):""}</span></div></button>`}).join("");
  sessionStorage.setItem("cr_played",JSON.stringify([...played]));
  $("#qn").textContent=state.queue.length?`(${state.queue.length})`:"";
}
$("#decks").addEventListener("click",e=>{const b=e.target.closest(".deck[data-i]");if(!b)return;const i=+b.dataset.i;
  if(i===ref&&refPinned){refPinned=false}else{ref=i;refPinned=true} drawDecks(); if(tab==="fits")render()});
// ---- rows ----
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function refDeck(){return ref>=0?state.decks[ref]:null}
function row(t){
  const r=refDeck(), rc=r?cam(r.key):null, m=rc?match(t.c,rc):"", g=r?bpmGap(t.bpm,r.bpm):null;
  const q=state.queue.some(x=>x.id===t.id&&x.stick===t.s), was=played.has(t.id);
  const gap=g?`${g.g>=0?"+":""}${g.g.toFixed(1)}%${g.f!==1?(g.f===2?" ×2":" ½"):""}`:"";
  return`<div class="row"><div class="k ${m}">${camStr(t.c)}</div><div class="tt" data-pick="${t.id}" data-s="${t.s}"><b>${esc(t.title)}</b><span>${esc(t.artist)}${was?' · <span class="played">played</span>':""}</span></div>
  <div class="bpm">${t.bpm?t.bpm.toFixed(1):"--"}<small>${gap||fmt(t.len)}</small></div>
  <button class="add ${q?"done":""}" data-id="${t.id}" data-s="${t.s}">${q?"✓":"+"}</button></div>`;
}
function rowsHtml(ts,limit=300){return ts.length?ts.slice(0,limit).map(row).join("")+(ts.length>limit?`<p class="hint">${ts.length-limit} more: narrow the search</p>`:""):`<p class="hint">Nothing here.</p>`}
// ---- tabs ----
function bar(){
  if(tab==="search")$("#bar").innerHTML=`<input id="q" placeholder="Title or artist" value="${esc(query)}" autocapitalize="off" autocorrect="off">`;
  else if(tab==="fits")$("#bar").innerHTML=[3,6,10].map(w=>`<button class="chip ${w===bpmWin?"on":""}" data-w="${w}">±${w}% BPM</button>`).join("")+`<span class="hint" style="padding:0 6px">tap a deck to pick what you're mixing from</span>`;
  else if(tab==="lists")$("#bar").innerHTML=path.length?`<button class="chip" id="up">‹ Back</button><span class="hint">${esc(path.map(p=>p.name).join(" / "))}</span>`:"";
  else $("#bar").innerHTML=state.queue.length?`<button class="chip" id="clear">Clear queue</button>`:"";
  const qi=$("#q"); if(qi){qi.addEventListener("input",e=>{query=e.target.value;render()});}
}
function render(){
  const L=lib[stick]; const el=$("#list");
  if(tab==="queue"){el.innerHTML=state.queue.length?state.queue.map((q,i)=>`<div class="row"><div class="k ${(()=>{const r=refDeck();return r?match(cam(q.key),cam(r.key)):""})()}">${camStr(cam(q.key))}</div><div class="tt"><b>${esc(q.title)}</b><span>${esc(q.artist)} · USB ${q.stick+1}</span></div><div class="bpm">${q.bpm?q.bpm.toFixed(1):""}</div><button class="add" data-rm="${i}">✕</button></div>`).join(""):`<p class="hint">Nothing queued. Tap + on a track; it shows on the deck.</p>`;return}
  if(!L){el.innerHTML=`<p class="hint">Reading USB ${stick+1}…</p>`;return}
  if(!L.length){el.innerHTML=`<p class="hint">No library on USB ${stick+1}.</p>`;return}
  if(tab==="search"){const q=query.trim().toLowerCase(); el.innerHTML=q.length<2?`<p class="hint">Type at least 2 letters.</p>`:rowsHtml(L.filter(t=>(t.title+" "+t.artist).toLowerCase().includes(q)));return}
  if(tab==="fits"){
    const r=refDeck(); if(!r){el.innerHTML=`<p class="hint">Load a track on a deck to see what fits.</p>`;return}
    const rc=cam(r.key), rank={good:0,risky:1}, out=[];
    for(const t of L){ if(t.id===r.id||played.has(t.id))continue; const m=match(t.c,rc); if(!(m in rank))continue;
      const g=bpmGap(t.bpm,r.bpm); if(!g||Math.abs(g.g)>bpmWin)continue; out.push([rank[m]*100+Math.abs(g.g)*(g.f===1?1:1.5),t]) }
    out.sort((a,b)=>a[0]-b[0]); el.innerHTML=`<p class="hint">Fits Deck ${r.d}: ${esc(r.title)} · ${camStr(rc)} · ${r.bpm?r.bpm.toFixed(1):"?"} BPM</p>`+rowsHtml(out.map(x=>x[1]),200);return}
  if(tab==="lists"){
    const P=lists[stick]; if(!P){el.innerHTML=`<p class="hint">Reading playlists…</p>`;loadLists(stick).then(render);return}
    const cur=path.length?path[path.length-1]:null;
    if(cur&&!cur.folder){ if(!plIds){el.innerHTML=`<p class="hint">Loading…</p>`;return}
      const byId=new Map(L.map(t=>[t.id,t])); el.innerHTML=rowsHtml(plIds.map(i=>byId.get(i)).filter(Boolean),1000);return}
    const parent=cur?cur.id:0, kids=P.filter(p=>p.parent===parent||(!cur&&!P.some(q=>q.id===p.parent)));
    el.innerHTML=kids.length?kids.map(p=>`<div class="folder" data-pl="${p.id}"><span class="ic">${p.folder?"▸":"♫"}</span>${esc(p.name)}</div>`).join(""):`<p class="hint">Empty folder.</p>`;
  }
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));bar();render();if(tab==="search")$("#q").focus()});
$("#sticks").addEventListener("click",async e=>{const b=e.target.closest("button[data-s]");if(!b)return;stick=+b.dataset.s;path=[];plIds=null;
  document.querySelectorAll("#sticks button").forEach(x=>x.classList.toggle("on",x===b));bar();render();if(!lib[stick]){await loadLib(stick);render()}});
$("#bar").addEventListener("click",async e=>{const w=e.target.closest("[data-w]");if(w){bpmWin=+w.dataset.w;bar();render();return}
  if(e.target.id==="up"){path.pop();plIds=null;if(path.length&&!path[path.length-1].folder)await openList(path[path.length-1]);bar();render();return}
  if(e.target.id==="clear"){state=await api("/api/queue/clear");drawDecks();render();bar()}});
async function openList(p){plIds=null;render();const j=await api(`/api/playlist?stick=${stick}&id=${p.id}`);plIds=j.ids;render()}
$("#list").addEventListener("click",async e=>{
  const f=e.target.closest("[data-pl]"); if(f){const p=lists[stick].find(x=>x.id===+f.dataset.pl);path.push(p);bar();if(!p.folder)await openList(p);else render();return}
  const rm=e.target.closest("[data-rm]"); if(rm){state=await api(`/api/queue/remove?i=${rm.dataset.rm}`);drawDecks();render();bar();return}
  const a=e.target.closest(".add[data-id]"); if(a&&!a.classList.contains("done")){
    state=await api(`/api/queue/add?stick=${a.dataset.s}&id=${a.dataset.id}`);drawDecks();render();toast("Queued: shows on the deck");}
});
// ---- deck actions ----
let pick=null;
function openSheet(id,s){
  const t=(lib[s]||[]).find(x=>x.id===id); if(!t)return; pick={t,pl:(tab==="lists"&&path.length)?path[path.length-1].id:-1};
  $("#shT").textContent=t.title; $("#shS").textContent=`${t.artist||""} · ${camStr(t.c)} · ${t.bpm?t.bpm.toFixed(1):"--"} BPM · USB ${s+1}`;
  sheetButtons(); $("#sheet").style.display="block";
}
function sheetButtons(){
  const canLoad=state.nav?state.nav.load:1;
  document.querySelectorAll("#sheet [data-ld]").forEach(b=>{const d=state.decks[+b.dataset.ld-1];
    const busy=d&&d.loaded&&d.playing; b.disabled=!canLoad||busy; b.textContent=busy?`Deck ${b.dataset.ld} ▶`:`Load ${b.dataset.ld}`});
}
async function send(deck){ if(!pick)return; const t=pick.t;
  const j=await api(`/api/deck?stick=${t.s}&id=${t.id}&deck=${deck}&pl=${pick.pl}`);
  $("#sheet").style.display="none"; toast(j.ok?(deck?`Loading on Deck ${deck}…`:"Sent to the deck"):j.error); }
$("#shShow").addEventListener("click",()=>send(0));
$("#shX").addEventListener("click",()=>{$("#sheet").style.display="none"});
document.querySelectorAll("#sheet [data-ld]").forEach(b=>b.addEventListener("click",()=>send(+b.dataset.ld)));
$("#list").addEventListener("click",e=>{const tt=e.target.closest("[data-pick]");if(tt)openSheet(+tt.dataset.pick,+tt.dataset.s)});
function drawNav(){ $("#navmsg").textContent=state.nav&&state.nav.msg?state.nav.msg:""; if($("#sheet").style.display==="block")sheetButtons(); }
// Redraw the list only when what it depends on changed, so a row's button is never
// swapped out from under a finger.
let lastSig="";
function listSig(){const r=refDeck();return tab+"|"+(r?[r.id,r.key,Math.round((r.bpm||0)*10)].join(","):"-")+"|"+state.queue.map(q=>q.stick+":"+q.id).join(",")+"|"+played.size}
async function poll(){try{state=await api("/api/state");drawDecks();drawNav();
  if(tab==="fits"||tab==="queue"){const sig=listSig();if(sig!==lastSig){lastSig=sig;render()}}}catch(e){} setTimeout(poll,2000)}
async function boot(){ try{ state=await api("/api/state"); }catch(e){return}
  drawDecks();bar();render(); await loadLib(stick); render(); poll(); loadLib(1-stick).catch(()=>{}); }
if(!PIN)askPin(); else boot();
</script>
</body>
</html>
